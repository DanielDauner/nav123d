hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra           # Store hydra's config breakdown here for debugging
  searchpath:
    - pkg://py123d.script.config
    - pkg://py123d.script.config.common
    - pkg://nav123d.script.config
    - pkg://nav123d.script.config.common
  job:
    chdir: False

defaults:
  - default_common
  - default_experiment
  - agent: ego_status_mlp_agent
  - test_scene_filter: [nuplan-mini_test]
  - metrics: [pdm_metric, displacement_metric]
  - _self_

experiment_name: evaluation_agent

# Results output (written into ${output_dir})
output_format: csv          # csv | parquet
results_file_stem: results
